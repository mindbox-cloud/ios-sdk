name: Prepare release branch

on:
  push:
    branches:
      - 'release/*.*.*'
      - 'support/*.*.*'

permissions:
  contents: read

jobs:
  extract_version:
    if: github.event.created
    name: Extract Version
    runs-on: macos-26
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract version from branch name
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          BRANCH_NAME="$REF_NAME"
          echo "BRANCH_NAME: $BRANCH_NAME"
          VERSION="${BRANCH_NAME#release/}"
          VERSION="${VERSION#support/}"
          echo "VERSION: $VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
  bump_version:
    name: Bump Version
    runs-on: macos-26
    needs: extract_version
    permissions:
      contents: write
    outputs:
      version2: ${{ steps.bump.outputs.version2 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Bump version
        env:
          VERSION: ${{ needs.extract_version.outputs.version }}
        run: ./.github/git-release-branch-create.sh "$VERSION"

      - name: Output version
        id: bump
        env:
          VERSION: ${{ needs.extract_version.outputs.version }}
        run: |
          echo "version2=$VERSION" >> "$GITHUB_OUTPUT"
          
  check_sdk_version:
    name: Check SDK Version
    runs-on: macos-26
    needs: bump_version
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull

      - name: Check if sdkVersion matches VERSION
        env:
          VERSION2: ${{ needs.bump_version.outputs.version2 }}
        run: |
          SDK_VERSION=$(sed -n 's/^.*sdkVersion = "\(.*\)"/\1/p' SDKVersionProvider/SDKVersionProvider.swift)
          if [ "$SDK_VERSION" != "$VERSION2" ]; then
            echo "SDK version ($SDK_VERSION) does not match the branch version ($VERSION2)."
            exit 1
          fi
        shell: bash

  create_pull_request:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: check_sdk_version
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh pr create \
            --base master \
            --head "$REF_NAME" \
            --title "$REF_NAME" \
            --body "Updates the release version to $REF_NAME"
          PR_URL=$(gh pr view --json url --jq '.url')
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
 
