name: SDK publish

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Update bundler
        run: gem install bundler
      - name: Install bundler dependencies
        run: bundle install
      - name: Run unit tests
        run: bundle exec fastlane unitTestLane

  set-tag:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Extract SDK version
        run: |
            SDK_VERSION=$(sed -n 's/^.*sdkVersion = "\(.*\)"/\1/p' SDKVersionProvider/SDKVersionProvider.swift)
            echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
            echo "Extracted SDK version: $SDK_VERSION"
      - name: Create tag
        run: |
            if git rev-parse -q --verify "refs/tags/$SDK_VERSION" >/dev/null; then
              echo "Local tag $SDK_VERSION already exists."
            else
              git tag "$SDK_VERSION"
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$SDK_VERSION")" ]; then
              echo "Remote tag $SDK_VERSION already exists."
            else
              git push origin "$SDK_VERSION"
            fi

  publish-MindboxLogger:
    needs: [set-tag]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Update bundler
        run: gem install bundler
      - name: Install bundler dependencies
        run: bundle install
      - name: Deploy to Cocoapods MindboxLogger
        run: |
          pod lib lint MindboxLogger.podspec --allow-warnings
          ./.github/pod-trunk-push.sh MindboxLogger.podspec --allow-warnings --verbose
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TOKEN }}
          
  delay:
    needs: [publish-MindboxLogger]
    runs-on: ubuntu-latest
    steps:
      - name: Delay for 20 minutes
        run: sleep 1200
      
  check-podspecs-with-retry:
    needs: [delay]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Update bundler
        run: gem install bundler
      - name: Install bundler dependencies
        run: bundle install
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 20
          command: |
              pod repo update
              pod lib lint --allow-warnings
          retry_on: error
          retry_wait_seconds: 120
          
  publish-MindboxNotifications:
    needs: [check-podspecs-with-retry]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Update bundler
        run: gem install bundler
      - name: Install bundler dependencies
        run: bundle install
      - name: Deploy to Cocoapods MindboxNotifications
        run: |
            pod repo update
            set -eo pipefail
            pod lib lint MindboxNotifications.podspec --allow-warnings
            ./.github/pod-trunk-push.sh MindboxNotifications.podspec --allow-warnings --verbose
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TOKEN }}
          
  second-delay:
    needs: [publish-MindboxNotifications]
    runs-on: ubuntu-latest
    steps:
      - name: Delay for 2 minutes
        run: sleep 120
  
  publish-Mindbox:
    needs: [second-delay]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Update bundler
        run: gem install bundler
      - name: Install bundler dependencies
        run: bundle install
      - name: Deploy to Cocoapods Mindbox
        run: |
            pod repo update
            set -eo pipefail
            pod lib lint Mindbox.podspec --allow-warnings
            ./.github/pod-trunk-push.sh Mindbox.podspec --allow-warnings --verbose
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TOKEN }}

  release-github:
    needs: [publish-MindboxLogger, publish-MindboxNotifications, publish-Mindbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Release generation
        run: ./.github/git-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.branch }}

  merge:
    needs: [publish-MindboxLogger, publish-MindboxNotifications, publish-Mindbox]
    if: startsWith(github.head_ref, 'release/') && github.base_ref == 'master'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: develop
      - name: Create Pull Request
        run: gh pr create --base develop --head master --title "Merge 'master' into 'develop' after release" --body "Automated Pull Request to merge 'master' into 'develop' after release"
      - name: Merge Pull Request
        run: |
          pr_number=$(gh pr list --base develop --head master --json number --jq '.[0].number')
          gh pr merge "$pr_number" --merge --auto
