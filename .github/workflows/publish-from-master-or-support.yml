name: SDK publish from master or support branch

on:
  pull_request:
    types: [closed]
    branches:
      - 'master'
      - 'support/*'

permissions:
  contents: read

jobs:
  call-reusable:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-reusable.yml
    with:
      branch: ${{ github.base_ref }}
    secrets:
      COCOAPODS_TOKEN: ${{ secrets.COCOAPODS_TOKEN }}
      PAT_FOR_TRIGGERING_BRANCH_PROTECTION: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
