name: Apple privacy rules

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable
    - uses: mindbox-cloud/xcprivacy-gate@5326ebcf35d96659bec78ed7702f1932bf2c78af # v0.1.0
      with:
        args: refresh --check --config .github/privacy-manifest/config.json
