name: SwiftLint & UnitTests

on:
  push:
    branches:
      - develop
      - mission/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      
permissions:
  contents: read

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.63.3@sha256:b70b763c949399cc3e4fdcfbc7588944d9503d498b6d96e853dfa07a944256e6
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - run: swiftlint --config .swiftlint.yml --reporter github-actions-logging --strict

  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Update bundler
      run: gem install bundler
    - name: Install bundler dependencies
      run: bundle install
    - name: Install yeetd
      run: |
          YEETD_SHA256="adb04eb720581a32d94daef3ea61108c74494083a79f00836556a36214f354be"
          wget -q https://github.com/biscuitehh/yeetd/releases/download/1.0/yeetd-normal.pkg
          echo "$YEETD_SHA256  yeetd-normal.pkg" | shasum -a 256 -c -
          sudo installer -pkg yeetd-normal.pkg -target /
          yeetd &
    - name: Run unit tests
      run: bundle exec fastlane unitTestLane

    # trainer builds report.junit from the xcresult, so Swift Testing results
    # survive regardless of the console formatter. Only failures are listed
    # (include_passed: false), so the PR comment stays compact even on green runs.
    - name: Publish unit-test summary
      uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
      if: ${{ !cancelled() }}
      with:
        report_paths: test_output/report.junit
        check_name: Unit tests report
        detailed_summary: true
        include_passed: false
        include_time_in_summary: true
        group_suite: true
        flaky_summary: true
        skip_success_summary: false
        simplified_summary: true
        include_empty_in_summary: false
        verbose_summary: false
        require_tests: true
        fail_on_failure: true
        fail_on_parse_error: true
        comment: ${{ github.event_name == 'pull_request' }}
        updateComment: true
        skip_comment_without_tests: true

    - name: Upload xcresult bundle
      id: xcresult
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: unit-tests-xcresult
        path: test_output/*.xcresult

    # Surface the artifact link in the job summary - GitHub otherwise only lists
    # artifacts at the very bottom of the run page, easy to miss on failed runs.
    - name: Link xcresult in summary
      if: ${{ !cancelled() }}
      env:
        ART_URL: ${{ steps.xcresult.outputs.artifact-url }}
      run: echo "⬇️ [Download Mindbox.xcresult]($ART_URL) — open in Xcode for coverage & full logs" >> "$GITHUB_STEP_SUMMARY"

    # Coverage site for GitHub Pages. The previously published history.json is
    # carried forward so the trend survives full-site redeploys.
    - name: Generate coverage site
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      run: |
        curl -fsSL "https://mindbox-cloud.github.io/ios-sdk/history.json" -o /tmp/prev-history.json || echo "[]" > /tmp/prev-history.json
        python3 .github/scripts/generate_coverage_site.py test_output/Mindbox.xcresult coverage-site /tmp/prev-history.json

    - name: Upload Pages artifact
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: coverage-site

  deploy-coverage:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
