name: SwiftLint & UnitTests

on:
  push:
    branches:
      - develop
      - mission/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: swiftlint --config .swiftlint.yml --reporter github-actions-logging --strict

  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/unit-tests
      with:
        check-name: Unit tests report
        artifact-name: unit-tests-xcresult
        comment: ${{ github.event_name == 'pull_request' }}

    # Coverage site for GitHub Pages. The previously published history.json is
    # carried forward so the trend survives full-site redeploys.
    - name: Generate coverage site
      if: ${{ github.ref == 'refs/heads/develop' }}
      run: |
        curl -fsSL "https://mindbox-cloud.github.io/ios-sdk/coverage/history.json" -o /tmp/prev-history.json || echo "[]" > /tmp/prev-history.json
        python3 .github/scripts/generate_coverage_site.py test_output/Mindbox.xcresult coverage-site /tmp/prev-history.json

    - name: Upload coverage site
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-site
        path: coverage-site
        retention-days: 1

  build-xcode-27:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/unit-tests
      with:
        check-name: Unit tests report (Xcode 27)
        artifact-name: unit-tests-xcresult-xcode-27

  api-reference-version:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/develop' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      cache-key: ${{ steps.version.outputs.cache-key }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Find the latest stable release
      id: version
      env:
        SCRIPT_HASH: ${{ hashFiles('.github/scripts/build_api_reference.sh') }}
      run: |
        set -euo pipefail
        tag=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
        [ -n "$tag" ] || { echo "::error::No stable release tag found"; exit 1; }
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "cache-key=api-reference-$tag-$SCRIPT_HASH" >> "$GITHUB_OUTPUT"

    - name: Look up the built API reference
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: api-reference.tar
        key: ${{ steps.version.outputs.cache-key }}
        lookup-only: true

  api-reference:
    runs-on: macos-26
    timeout-minutes: 20
    needs: api-reference-version
    if: ${{ needs.api-reference-version.outputs.cache-hit != 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.api-reference-version.outputs.tag }}
        path: release

    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Build the API reference
      run: |
        .github/scripts/build_api_reference.sh release api-reference
        COPYFILE_DISABLE=1 tar -cf api-reference.tar -C api-reference .

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: api-reference
        path: api-reference.tar
        retention-days: 1

  pages:
    runs-on: ubuntu-latest
    needs: [build, api-reference-version, api-reference]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.api-reference-version.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download coverage site
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-site
        path: site/coverage

    - name: Download API reference
      if: ${{ needs.api-reference.result == 'success' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: api-reference

    - name: Cache API reference
      if: ${{ needs.api-reference.result == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: api-reference.tar
        key: ${{ needs.api-reference-version.outputs.cache-key }}

    - name: Restore API reference
      if: ${{ needs.api-reference.result != 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: api-reference.tar
        key: ${{ needs.api-reference-version.outputs.cache-key }}
        restore-keys: api-reference-

    - name: Assemble site
      run: |
        cp .github/pages/index.html site/
        [ -f api-reference.tar ] || { echo "::error::No API reference to deploy; the published site stays as it is"; exit 1; }
        mkdir site/api
        tar -xf api-reference.tar -C site/api

    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
