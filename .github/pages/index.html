<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindbox iOS SDK</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --card: #f5f5f7; --link: #0066cc; }
@media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --card: #1d1d1f; --link: #4da3ff; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
h1 { font-size: 32px; margin: 0 0 32px; }
a.card { display: block; padding: 20px 24px; margin-bottom: 16px; border-radius: 12px; background: var(--card); color: var(--fg); text-decoration: none; }
a.card strong { display: block; font-size: 18px; color: var(--link); }
a.card span { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Mindbox iOS SDK</h1>
<a class="card" href="api/"><strong>API reference</strong><span>Public API of the latest stable release</span></a>

</main>
</body>
</html>
